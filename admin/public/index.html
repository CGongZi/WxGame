<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WxGame CMS Mock</title>
  <style>
    :root {
      --bg: #12141c;
      --panel: #1a1e2a;
      --line: #2a3144;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #5b8def;
      --ok: #3dba7a;
      --bad: #e25b5b;
      --warn: #d4a017;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e2740 0%, var(--bg) 55%);
      color: var(--text);
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      background: rgba(18, 20, 28, 0.85); backdrop-filter: blur(8px);
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: 0.02em; }
    header .meta { color: var(--muted); font-size: 13px; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 18px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, select, textarea, button {
      font: inherit; color: var(--text);
    }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--line); background: #0f121a;
    }
    textarea {
      width: 100%; min-height: 420px; padding: 12px;
      border-radius: 8px; border: 1px solid var(--line);
      background: #0c0f16; font-family: ui-monospace, Consolas, monospace;
      font-size: 13px; line-height: 1.45; resize: vertical;
    }
    button {
      border: 0; border-radius: 8px; padding: 10px 14px;
      background: var(--accent); cursor: pointer; font-weight: 600;
    }
    button.secondary { background: #2a3348; }
    button.danger { background: #6b3030; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    .row > * { flex: 1; min-width: 140px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .status {
      margin-top: 12px; padding: 10px 12px; border-radius: 8px;
      background: #0f121a; border: 1px solid var(--line);
      color: var(--muted); font-size: 13px; white-space: pre-wrap;
    }
    .status.ok { color: var(--ok); border-color: #2a5a40; }
    .status.bad { color: var(--bad); border-color: #5a2a2a; }
    .hidden { display: none !important; }
    #loginCard { max-width: 380px; margin: 80px auto; }
    .field { margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>WxGame CMS <span style="color:var(--muted);font-weight:500">K8–K12 mock</span></h1>
    <div class="meta" id="headerMeta">未登录</div>
  </header>
  <main>
    <section class="card" id="loginCard">
      <div class="field">
        <label>用户名</label>
        <input id="user" value="admin" autocomplete="username" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="pass" type="password" value="wxgame-dev" autocomplete="current-password" />
      </div>
      <div class="actions">
        <button id="btnLogin">登录</button>
      </div>
      <div class="status" id="loginStatus">默认账号 admin / wxgame-dev</div>
    </section>

    <section class="card hidden" id="editorCard">
      <div class="row">
        <div>
          <label>实体 kind</label>
          <select id="kind"></select>
        </div>
        <div>
          <label>快捷</label>
          <div class="actions" style="margin:0">
            <button class="secondary" id="btnReload" type="button">重新加载</button>
            <button id="btnSave" type="button">保存 PATCH</button>
          </div>
        </div>
      </div>
      <div style="margin-top:12px" id="formCard" class="hidden">
        <label>字段表单（角色 / 武器 / 怪物 / 道具）</label>
        <div class="row" style="margin-top:8px">
          <div>
            <label>条目</label>
            <select id="formItem"></select>
          </div>
          <div class="actions" style="margin:0;align-items:end">
            <button class="secondary" id="btnFormApply" type="button">写回 JSON</button>
            <button class="secondary" id="btnFormNew" type="button">新建条目</button>
          </div>
        </div>
        <div id="formFields" class="row" style="margin-top:10px"></div>
      </div>
      <div style="margin-top:12px">
        <label>草稿 JSON（与 ConfigSchema 字段对齐）</label>
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
      <div class="actions">
        <button class="secondary" id="btnValidate" type="button">校验整包</button>
        <button id="btnPublish" type="button">发布 publish</button>
        <button class="secondary" id="btnRollback" type="button">回滚上一版</button>
        <button class="secondary" id="btnAudit" type="button">审计日志</button>
        <button class="secondary" id="btnBump" type="button">draft version +1</button>
        <button class="danger" id="btnReset" type="button">从 seed 重置</button>
        <button class="secondary" id="btnLatest" type="button">打开 /api/pack/latest</button>
      </div>
      <div class="status" id="status">已登录。改 sword.damage 后保存 → 校验。</div>
    </section>

    <section class="card hidden" id="uploadCard" style="margin-top:16px">
      <div class="row">
        <div>
          <label>资源上传（K10 · 本地 mock CDN）</label>
          <input id="file" type="file" accept=".png,.jpg,.jpeg,.webp,.gif,.mp3,.wav,.ogg,.json,image/*,audio/*,application/json" />
        </div>
        <div>
          <label>可选 id</label>
          <input id="assetId" placeholder="sword-icon" />
        </div>
      </div>
      <div class="actions">
        <button id="btnUpload" type="button">上传</button>
        <button class="secondary" id="btnListAssets" type="button">刷新列表</button>
      </div>
      <div class="status" id="uploadStatus">支持图片 / 音效 / JSON，≤2MB。包内只存 url/id。</div>
      <pre id="assetList" style="margin-top:10px;font-size:12px;color:var(--muted);white-space:pre-wrap"></pre>
    </section>
  </main>
  <script>
    const state = { token: localStorage.getItem('cmsToken') || '', kind: 'weapons' };

    const $ = (id) => document.getElementById(id);
    const kinds = [
      'characters','weapons','enemies','mapThemes','biomeSpawn',
      'encounters','themeEncounters','floors','drops','items','talents','shop','economy','dungeon'
    ];

    function setStatus(el, text, cls) {
      el.className = 'status' + (cls ? ' ' + cls : '');
      el.textContent = text;
    }

    async function api(method, path, body) {
      const headers = { 'Content-Type': 'application/json' };
      if (state.token) headers.Authorization = 'Bearer ' + state.token;
      const res = await fetch(path, {
        method,
        headers,
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    }

    function showApp(loggedIn) {
      $('loginCard').classList.toggle('hidden', loggedIn);
      $('editorCard').classList.toggle('hidden', !loggedIn);
      $('uploadCard').classList.toggle('hidden', !loggedIn);
      $('headerMeta').textContent = loggedIn
        ? 'Bearer · /api/pack/latest · /media/:id'
        : '未登录';
    }

    function fillKinds() {
      const sel = $('kind');
      sel.innerHTML = '';
      for (const k of kinds) {
        const o = document.createElement('option');
        o.value = k; o.textContent = k;
        if (k === state.kind) o.selected = true;
        sel.appendChild(o);
      }
    }

    const FORM_KINDS = {
      characters: [
        ['id', 'id'], ['name', 'name'], ['emoji', 'emoji'], ['desc', 'desc'],
        ['cost', 'cost', 'number'], ['skinId', 'skinId'], ['exclusiveWeaponId', 'exclusiveWeaponId'],
      ],
      weapons: [
        ['id', 'id'], ['name', 'name'], ['emoji', 'emoji'], ['type', 'type'],
        ['damage', 'damage', 'number'], ['cooldown', 'cooldown', 'number'],
        ['range', 'range', 'number'], ['rarity', 'rarity'],
        ['unlockFloor', 'unlockFloor', 'number'], ['dropWeight', 'dropWeight', 'number'],
        ['ownerCharacterId', 'ownerCharacterId'],
      ],
      enemies: [
        ['id', 'id'], ['hp', 'hp', 'number'], ['damage', 'damage', 'number'],
        ['speed', 'speed', 'number'], ['behaviorId', 'behaviorId'],
        ['bodySize', 'bodySize', 'number'], ['attackRange', 'attackRange', 'number'],
      ],
      items: [
        ['id', 'id'], ['name', 'name'], ['emoji', 'emoji'], ['kind', 'kind'],
        ['rarity', 'rarity'], ['dropWeight', 'dropWeight', 'number'],
      ],
    };

    function parseEditor() {
      return JSON.parse($('editor').value);
    }

    function refreshForm() {
      const kind = $('kind').value;
      const fields = FORM_KINDS[kind];
      const formCard = $('formCard');
      if (!fields) {
        formCard.classList.add('hidden');
        return;
      }
      formCard.classList.remove('hidden');
      let arr;
      try { arr = parseEditor(); }
      catch { formCard.classList.add('hidden'); return; }
      if (!Array.isArray(arr)) {
        formCard.classList.add('hidden');
        return;
      }
      const sel = $('formItem');
      const prev = sel.value;
      sel.innerHTML = '';
      arr.forEach((row, i) => {
        const o = document.createElement('option');
        o.value = String(i);
        o.textContent = (row && (row.id || row.name) ? `${row.id || ''} ${row.name || ''}` : `#${i}`).trim();
        sel.appendChild(o);
      });
      if (prev && Number(prev) < arr.length) sel.value = prev;
      fillFormFields(arr[Number(sel.value) || 0], fields);
    }

    function fillFormFields(row, fields) {
      const host = $('formFields');
      host.innerHTML = '';
      if (!row) return;
      for (const [key, label, type] of fields) {
        const wrap = document.createElement('div');
        wrap.className = 'field';
        wrap.style.minWidth = '160px';
        const lab = document.createElement('label');
        lab.textContent = label;
        const input = document.createElement('input');
        input.dataset.key = key;
        input.type = type === 'number' ? 'number' : 'text';
        input.step = type === 'number' ? 'any' : undefined;
        const v = row[key];
        input.value = v === undefined || v === null ? '' : String(v);
        wrap.appendChild(lab);
        wrap.appendChild(input);
        host.appendChild(wrap);
      }
    }

    function applyFormToJson() {
      const kind = $('kind').value;
      const fields = FORM_KINDS[kind];
      if (!fields) return;
      let arr;
      try { arr = parseEditor(); }
      catch (e) {
        setStatus($('status'), 'JSON 解析失败: ' + e.message, 'bad');
        return;
      }
      if (!Array.isArray(arr)) return;
      const idx = Number($('formItem').value);
      if (!arr[idx]) return;
      const row = { ...arr[idx] };
      for (const input of $('formFields').querySelectorAll('input[data-key]')) {
        const key = input.dataset.key;
        const spec = fields.find((f) => f[0] === key);
        if (!spec) continue;
        if (spec[2] === 'number') {
          const n = Number(input.value);
          if (input.value === '' || Number.isNaN(n)) delete row[key];
          else row[key] = n;
        } else {
          const t = input.value.trim();
          if (!t) delete row[key];
          else row[key] = t;
        }
      }
      arr[idx] = row;
      $('editor').value = JSON.stringify(arr, null, 2);
      setStatus($('status'), `已写回 ${kind}[${idx}] → JSON（记得点保存 PATCH）`, 'ok');
      refreshForm();
    }

    function newFormItem() {
      const kind = $('kind').value;
      const fields = FORM_KINDS[kind];
      if (!fields) return;
      let arr;
      try { arr = parseEditor(); }
      catch (e) {
        setStatus($('status'), 'JSON 解析失败: ' + e.message, 'bad');
        return;
      }
      if (!Array.isArray(arr)) return;
      const blank = { id: kind.slice(0, -1) + '_' + (arr.length + 1), name: '新条目' };
      arr.push(blank);
      $('editor').value = JSON.stringify(arr, null, 2);
      refreshForm();
      $('formItem').value = String(arr.length - 1);
      fillFormFields(arr[arr.length - 1], fields);
      setStatus($('status'), '已追加条目（记得写回字段并保存）', 'ok');
    }

    async function loadKind() {
      state.kind = $('kind').value;
      const data = await api('GET', '/api/entities/' + state.kind);
      $('editor').value = JSON.stringify(data.draft, null, 2);
      setStatus($('status'), '已加载 ' + state.kind, 'ok');
      refreshForm();
    }

    $('formItem').onchange = () => {
      try {
        const arr = parseEditor();
        const fields = FORM_KINDS[$('kind').value];
        if (!fields || !Array.isArray(arr)) return;
        fillFormFields(arr[Number($('formItem').value)], fields);
      } catch { /* ignore */ }
    };
    $('btnFormApply').onclick = () => applyFormToJson();
    $('btnFormNew').onclick = () => newFormItem();
    $('editor').addEventListener('blur', () => {
      try { refreshForm(); } catch { /* ignore */ }
    });

    async function saveKind() {
      let value;
      try { value = JSON.parse($('editor').value); }
      catch (e) {
        setStatus($('status'), 'JSON 解析失败: ' + e.message, 'bad');
        return;
      }
      const out = await api('PATCH', '/api/entities/' + state.kind, { draft: value });
      setStatus($('status'), '已保存 ' + state.kind + ' · publishedAt ' + out.publishedAt, 'ok');
    }

    $('btnLogin').onclick = async () => {
      try {
        const out = await api('POST', '/api/auth/login', {
          username: $('user').value.trim(),
          password: $('pass').value,
        });
        state.token = out.token;
        localStorage.setItem('cmsToken', out.token);
        showApp(true);
        fillKinds();
        await loadKind();
      } catch (e) {
        setStatus($('loginStatus'), String(e.message || e), 'bad');
      }
    };

    $('kind').onchange = () => loadKind().catch((e) => setStatus($('status'), String(e.message || e), 'bad'));
    $('btnReload').onclick = () => loadKind().catch((e) => setStatus($('status'), String(e.message || e), 'bad'));
    $('btnSave').onclick = () => saveKind().catch((e) => setStatus($('status'), String(e.message || e), 'bad'));

    $('btnValidate').onclick = async () => {
      try {
        const out = await api('POST', '/api/pack/validate', {});
        setStatus($('status'), out.ok ? '结构校验通过' : ('校验失败: ' + out.error), out.ok ? 'ok' : 'bad');
      } catch (e) {
        setStatus($('status'), String(e.message || e), 'bad');
      }
    };

    $('btnPublish').onclick = async () => {
      try {
        const out = await api('POST', '/api/pack/publish', {});
        setStatus($('status'), `已发布 v${out.version} → ${out.url}`, 'ok');
      } catch (e) {
        setStatus($('status'), String(e.message || e), 'bad');
      }
    };

    $('btnRollback').onclick = async () => {
      try {
        const info = await api('GET', '/api/pack/versions');
        const versions = info.versions || [];
        if (versions.length < 2) {
          setStatus($('status'), '需要至少两个已发版本才能回滚', 'bad');
          return;
        }
        const current = info.latest && info.latest.version;
        const older = versions.filter((v) => v.version !== current);
        const target = older[0];
        if (!target) {
          setStatus($('status'), '找不到可回滚的旧版本', 'bad');
          return;
        }
        if (!confirm('回滚 latest → v' + target.version + '？')) return;
        const out = await api('POST', '/api/pack/rollback', { version: target.version });
        setStatus($('status'), `已回滚到 v${out.version}`, 'ok');
        await loadKind();
      } catch (e) {
        setStatus($('status'), String(e.message || e), 'bad');
      }
    };

    $('btnAudit').onclick = async () => {
      try {
        const out = await api('GET', '/api/audit?limit=20');
        const lines = (out.entries || []).map((e) => `${e.at}  ${e.actor}  ${e.action}  ${JSON.stringify(e.detail || {})}`);
        setStatus($('status'), lines.length ? lines.join('\n') : '(无审计记录)', 'ok');
      } catch (e) {
        setStatus($('status'), String(e.message || e), 'bad');
      }
    };

    $('btnBump').onclick = async () => {
      try {
        const out = await api('POST', '/api/pack/bump', {});
        setStatus($('status'), 'version → ' + out.version, 'ok');
      } catch (e) {
        setStatus($('status'), String(e.message || e), 'bad');
      }
    };

    $('btnReset').onclick = async () => {
      if (!confirm('用 seed-draft 覆盖当前草稿？')) return;
      try {
        await api('POST', '/api/pack/reset', {});
        await loadKind();
        setStatus($('status'), '已从 seed 重置', 'ok');
      } catch (e) {
        setStatus($('status'), String(e.message || e), 'bad');
      }
    };

    $('btnLatest').onclick = () => window.open('/api/pack/latest', '_blank');

    async function refreshAssets() {
      const data = await api('GET', '/api/assets');
      const lines = (data.assets || []).map((a) => `${a.id}  ${a.bytes}B  ${a.url}`);
      $('assetList').textContent = lines.length ? lines.join('\n') : '(暂无上传)';
    }

    $('btnListAssets').onclick = () => refreshAssets().catch((e) => setStatus($('uploadStatus'), String(e.message || e), 'bad'));

    $('btnUpload').onclick = async () => {
      const file = $('file').files && $('file').files[0];
      if (!file) {
        setStatus($('uploadStatus'), '请选择文件', 'bad');
        return;
      }
      const fd = new FormData();
      fd.append('file', file);
      const id = $('assetId').value.trim();
      if (id) fd.append('id', id);
      try {
        const res = await fetch('/api/assets', {
          method: 'POST',
          headers: state.token ? { Authorization: 'Bearer ' + state.token } : {},
          body: fd,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        setStatus($('uploadStatus'), `已上传 ${data.asset.id} → ${data.asset.url}`, 'ok');
        $('file').value = '';
        await refreshAssets();
      } catch (e) {
        setStatus($('uploadStatus'), String(e.message || e), 'bad');
      }
    };

    (async () => {
      fillKinds();
      if (!state.token) { showApp(false); return; }
      try {
        await api('GET', '/api/entities');
        showApp(true);
        await loadKind();
        await refreshAssets().catch(() => {});
      } catch {
        state.token = '';
        localStorage.removeItem('cmsToken');
        showApp(false);
      }
    })();
  </script>
</body>
</html>
